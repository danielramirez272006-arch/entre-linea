name: CI — Verificación de Desarrollo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_ephemeral_pg_password
          POSTGRES_DB: entre_lineas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 1. Checkout del commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: 1b. Escaneo de secretos en historial con Gitleaks
        uses: gitleaks/gitleaks-action@cb7149a900a058b4e38660a557489c3b859a8708 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 2. Configurar Node.js LTS con caché npm
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: 3. Instalar dependencias con lockfile único
        run: npm ci

      - name: 4. Ejecutar pruebas unitarias y de API (repositorio simulado)
        run: npm run test:unit

      - name: 5. Generar llave efímera AES-256 para migraciones y pruebas
        id: ephemeral_key
        run: |
          KEY=$(node -e "console.log(require('node:crypto').randomBytes(32).toString('hex'))")
          echo "::add-mask::$KEY"
          echo "keys_json={\"v1\":\"$KEY\"}" >> "$GITHUB_OUTPUT"

      - name: 6. Aplicar migraciones y ejecutar integración con PostgreSQL real
        env:
          NODE_ENV: test
          REQUIRE_INTEGRATION_DB: "true"
          DATABASE_URL: postgres://postgres:ci_ephemeral_pg_password@localhost:5432/entre_lineas_test
          TEST_DATABASE_URL: postgres://postgres:ci_ephemeral_pg_password@localhost:5432/entre_lineas_test
          ENCRYPTION_ACTIVE_KEY_VERSION: v1
          ENCRYPTION_KEYS_JSON: ${{ steps.ephemeral_key.outputs.keys_json }}
        run: |
          npm run db:migrate
          unset DATABASE_URL
          npm run test:integration

      - name: 7. Compilar frontend React
        run: npm run build

      - name: 8. Instalar Chromium y ejecutar pruebas de navegador Playwright + E2E
        env:
          NODE_ENV: test
          REQUIRE_INTEGRATION_DB: "true"
          TEST_DATABASE_URL: postgres://postgres:ci_ephemeral_pg_password@localhost:5432/entre_lineas_test
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser
          npm run test:e2e

      - name: 9. Auditoría de vulnerabilidades altas o críticas
        run: npm run audit:check

      - name: 10. Verificar build de imagen Docker con usuario no-root
        run: |
          docker build -t entre-lineas:ci .
          USER_CFG=$(docker inspect --format '{{.Config.User}}' entre-lineas:ci)
          echo "Usuario del contenedor: $USER_CFG"
          test "$USER_CFG" = "appuser"

